name: CI and deploy
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this master revision to production
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codehive
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: codehive_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codehive -d codehive_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: npm run release -- --check
      - name: Validate PostgreSQL migrations and public API
        working-directory: backend
        env:
          CODEHIVE_DATABASE_URL: postgresql+psycopg://codehive:ci-only-password@localhost:5432/codehive_ci
        run: |
          python -m alembic upgrade head
          python -m alembic upgrade head
          python -m alembic check
          python -c 'from fastapi.testclient import TestClient; from app.main import app; c=TestClient(app); r=c.get("/api/competitions"); assert r.status_code == 200 and r.json()["total"] == 3'
      - name: Validate deployment configuration
        run: |
          bash -n scripts/deploy-release.sh
          POSTGRES_PASSWORD=$(printf 'a%.0s' {1..64}) SITE_ORIGIN=https://codehive.asia RELEASE_ID=ci docker compose -f deploy/compose.yml config --quiet
          docker build -f deploy/backend.Dockerfile -t codehive-api:ci .
  deploy:
    needs: check
    if: >-
      github.ref == 'refs/heads/master' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
       (github.event_name == 'push' && vars.CODEHIVE_AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: codehive-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock.txt
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CODEHIVE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CODEHIVE_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy checked revision
        env:
          DEPLOY_HOST: ${{ vars.CODEHIVE_SSH_HOST || 'root@47.102.85.207' }}
          DEPLOY_PORT: ${{ vars.CODEHIVE_SSH_PORT || '22' }}
          DEPLOY_MODE: fullstack
        run: npm run release -- --deploy-only
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
