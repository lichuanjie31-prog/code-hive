name: codehive
services:
  db:
    image: public.ecr.aws/docker/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: codehive
      POSTGRES_USER: codehive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codehive -d codehive"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    image: codehive-api:${RELEASE_ID:?Set RELEASE_ID}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      CODEHIVE_DATABASE_URL: postgresql+psycopg://codehive:${POSTGRES_PASSWORD}@db:5432/codehive
      CODEHIVE_ENVIRONMENT: production
      CODEHIVE_COOKIE_SECURE: "true"
      CODEHIVE_ALLOWED_ORIGINS: '["${SITE_ORIGIN:?Set SITE_ORIGIN}"]'
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/competitions', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 30
volumes:
  database:
    name: codehive-postgres
